services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - DOCS_DIR=/app/data/docs
      - INDEX_DIR=/app/data/indexes
      - TOP_K=3
      - ADMIN_TOKEN=devtoken

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
